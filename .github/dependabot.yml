version: 2
updates:
  # Grouped so a quiet project gets one pull request a month rather than a
  # steady drip of single-package bumps nobody reviews.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint 8 pins its peer range to typescript <6.1, so a major
      # bump here cannot install at all and the pull request fails at npm ci.
      # Lift this once typescript-eslint supports the newer major.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      rust:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
