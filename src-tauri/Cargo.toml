[package]
name = "trinket"
version = "0.1.0"
description = "A desktop shelf of mouse-driven fidget toys."
authors = ["Owen Kent"]
license = "MIT"
repository = "https://github.com/owenpkent/trinket"
edition = "2021"
rust-version = "1.77.2"

# The binary is a thin wrapper so the same entry point can be reused if this
# ever needs a mobile target.
[lib]
name = "trinket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
